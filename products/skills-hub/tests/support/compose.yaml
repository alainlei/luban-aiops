services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: spec066
      POSTGRES_DB: spec066
      POSTGRES_PASSWORD: ${SPEC066_DB_PASSWORD:?generated by harness}
    ports:
      # Loopback-only, ephemeral host port: the database is never reachable off
      # this machine. The harness asserts the published endpoint is 127.0.0.1.
      - "127.0.0.1::5432"
    labels:
      io.luban.spec066.owner: ${SPEC066_OWNER:?generated by harness}
    volumes:
      - skills:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U spec066 -d spec066"]
      interval: 1s
      timeout: 2s
      retries: 30
volumes:
  skills:
    labels:
      io.luban.spec066.owner: ${SPEC066_OWNER:?generated by harness}
networks:
  default:
    driver: bridge
    labels:
      io.luban.spec066.owner: ${SPEC066_OWNER:?generated by harness}
