[project]
name = "tool-gateway"
version = "0.43.1"
description = "API gateway for Luban AIOps."
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43.0,<51.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "elasticsearch>=8.0,<9.0",
  "kubernetes>=30.0,<33.0",
  "opentelemetry-exporter-otlp-proto-http>=1.25,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
  "opentelemetry-instrumentation-httpx>=0.46b0",
  "opentelemetry-instrumentation-logging>=0.46b0",
  "opentelemetry-sdk>=1.25,<2.0",
  "playwright>=1.48,<2.0",
  "prometheus-client>=0.20,<1.0",
  "pydantic>=2.8,<3.0",
  "PyJWT>=2.8,<3.0",
  "PyYAML>=6.0,<7.0",
  "redis>=5.0,<7.0",
  "uvicorn[standard]>=0.30,<1.0"
]

[project.scripts]
tool-gateway = "tool_gateway.main:run"

[dependency-groups]
dev = [
  "jsonschema>=4.23,<5.0",
  "pytest>=8.3,<9.0"
]

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"
