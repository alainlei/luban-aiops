[project]
name = "agent-service"
version = "0.47.0"
description = "Runtime service for the Luban AIOps agent platform."
requires-python = ">=3.11"
dependencies = [
  "agentscope>=2.0.4,<3.0",
  "agentscope-runtime>=1.1,<2.0",
  "apscheduler>=3.11,<4.0",
  "fastapi>=0.115,<1.0",
  "jsonschema>=4.23,<5.0",
  "opentelemetry-exporter-otlp-proto-http>=1.25,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
  "opentelemetry-instrumentation-httpx>=0.46b0",
  "opentelemetry-instrumentation-logging>=0.46b0",
  "opentelemetry-sdk>=1.25,<2.0",
  "prometheus-client>=0.20,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic>=2.8,<3.0",
  "redis>=6.2,<7.0",
  "uvicorn[standard]>=0.30,<1.0"
]

[project.scripts]
agent-service = "agent_service.main:run"
agent-service-runtime = "agent_service.agent_app:run"
agent-service-native = "agent_service.native_service:run"

[dependency-groups]
dev = [
  "fakeredis>=2.26,<3.0",
  "pytest>=8.3,<9.0"
]

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"
