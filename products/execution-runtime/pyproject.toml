[project]
name = "execution-runtime"
version = "0.45.0"
description = "Isolated execution worker for approved bounded actions (SPEC-038)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "jsonschema>=4.23,<5.0",
  "opentelemetry-exporter-otlp-proto-http>=1.25,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
  "opentelemetry-instrumentation-httpx>=0.46b0",
  "opentelemetry-instrumentation-logging>=0.46b0",
  "opentelemetry-sdk>=1.25,<2.0",
  "prometheus-client>=0.20,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "uvicorn[standard]>=0.30,<1.0"
]

[project.scripts]
execution-runtime = "execution_runtime.main:run"

[dependency-groups]
dev = [
  "pytest>=8.3,<9.0"
]

[tool.pytest.ini_options]
# Explicit failure/run.py is mandatory in the root verification gate.
norecursedirs = ["failure", ".*", "build", "dist", "node_modules", "venv"]

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"
