apiVersion: apps/v1
kind: Deployment
metadata:
  name: skills-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skills-hub
  template:
    metadata:
      labels:
        app: skills-hub
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      # Service-link env vars (SKILLS_HUB_PORT=tcp://…) collide with the
      # service's own port setting; service discovery uses DNS names instead.
      enableServiceLinks: false
      containers:
        - name: skills-hub
          image: luban-aiops/skills-hub:dev-local
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - configMapRef:
                name: platform-runtime-config
            - secretRef:
                name: skills-hub-runtime-secrets
                optional: true
          ports:
            - containerPort: 8000
          # Probes need headroom beyond the 1s default: while the dev host is
          # under load (e.g. after VM sleep/wake) healthy responses were taking
          # 2-4s, which triggered needless liveness kills and crash loops.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 4
          volumeMounts:
            # Tutorial sample skills (SPEC-050 R-11): an optional ConfigMap
            # populated out-of-band by `make deploy-samples`, not by the base
            # overlay. Absent by default so the platform deploys cleanly with
            # no samples installed; the `samples` local source ingests
            # whatever lands here.
            #
            # Platform runbooks and SRE alerts are deliberately NOT mounted:
            # they arrive through the `platform-skills` git source, and a
            # ConfigMap mount of the same files used to ingest every document
            # a second time under a different source-prefixed skill_id.
            - name: skills-samples
              mountPath: /skills/samples
              readOnly: true
            # Disposable cache for git-source checkouts (empty by default in
            # dev; no persistence needed — sync re-materializes on startup).
            - name: skills-data
              mountPath: /var/lib/skills-hub
      volumes:
        # Tutorial sample skills (SPEC-050 R-11): optional ConfigMap created
        # out-of-band by `make deploy-samples`. Keys mount flat (no `items`)
        # so the base stays sample-agnostic; absent by default, which leaves
        # /skills/samples empty and the `samples` source ingests nothing.
        - name: skills-samples
          configMap:
            name: skills-samples
            optional: true
        - name: skills-data
          emptyDir: {}
