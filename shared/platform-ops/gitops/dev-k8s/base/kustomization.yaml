apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev-luban-aiops
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: platform-runtime-config
    envs:
      - shared/runtime.env
      - agent-platform/runtime-config.env
      - platform-gateway/runtime-config.env
      - tool-gateway/runtime-config.env
      - identity-broker/runtime-config.env
      - audit-service/runtime-config.env
      - skills-hub/runtime-config.env
      - incident-service/runtime-config.env
      - execution-runtime/runtime-config.env
  - name: platform-policy
    files:
      - shared/policy.yaml
      - password-policy.yaml=../../../../shared-contracts/policies/password-policy.yaml
  # Skill content is not generated here. shared/platform-ops/skills reaches
  # skills-hub through the `platform-skills` git source in
  # skills-hub/runtime-config.env; generating ConfigMaps from the same files
  # registered every document a second time under a different source-prefixed
  # skill_id. The `skills-samples` ConfigMap is created out-of-band by
  # `make deploy-samples`, and the base overlay never names a sample.
  - name: postgres-initdb
    files:
      - infra/create-skills-db.sql
      - infra/create-incidents-db.sql
      - infra/create-sessions-db.sql
resources:
  - shared/namespace.yaml
  - infra/redis-deployment.yaml
  - infra/redis-service.yaml
  - infra/postgres-statefulset.yaml
  - infra/postgres-service.yaml
  - operator-portal/web-ui-deployment.yaml
  - operator-portal/web-ui-service.yaml
  - operator-portal/web-ui-httproute.yaml
  - platform-gateway/rbac.yaml
  - platform-gateway/platform-gateway-deployment.yaml
  - platform-gateway/platform-gateway-service.yaml
  - tool-gateway/rbac.yaml
  - tool-gateway/tool-gateway-deployment.yaml
  - tool-gateway/tool-gateway-service.yaml
  - agent-platform/agent-service-deployment.yaml
  - agent-platform/agent-service-service.yaml
  - identity-broker/identity-service-deployment.yaml
  - identity-broker/identity-service-service.yaml
  - audit-service/audit-service-deployment.yaml
  - audit-service/audit-service-service.yaml
  - skills-hub/skills-hub-deployment.yaml
  - skills-hub/skills-hub-service.yaml
  - incident-service/incident-service-deployment.yaml
  - incident-service/incident-service-service.yaml
  - execution-runtime/execution-runtime-deployment.yaml
  - execution-runtime/execution-runtime-service.yaml
